name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Builds the complete server configuration ("system", once `just init`
      # has run) and the example configuration. Fails on option errors,
      # broken assertions (e.g. a domain without DKIM key or postmaster@
      # address) and secrets referenced but missing from secrets.yaml.
      - name: Build
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' \
            | xargs nix build -L --no-link
      - name: Formatting
        run: nix fmt -- --ci
      - name: NixOS release support
        run: |
          nix develop -c scripts/check-release.sh \
            || echo "::warning::$(nix develop -c scripts/check-release.sh 2>&1 | tail -n1)"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Validate
        run: |
          nix eval --json .#tfvars | jq '{mail: .}' > settings.auto.tfvars.json
          nix develop -c tofu fmt -check -recursive infra
          for dir in infra/servers/* infra/dns/*; do
            echo "::group::$dir"
            cp settings.auto.tfvars.json "$dir/"
            nix develop -c tofu -chdir="$dir" init -backend=false -input=false
            nix develop -c tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
