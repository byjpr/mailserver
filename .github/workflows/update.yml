# Opens a pull request every week that bumps nixpkgs and the other flake
# inputs. Merging it and running `just deploy` - or letting
# settings.autoUpgrade pick it up - keeps the server patched.
#
# Pull requests opened with the workflow's GITHUB_TOKEN do not trigger other
# workflows (a GitHub rule), so ci.yml would never run on them. Everything CI
# would check is therefore built here, before the pull request is opened: an
# update that breaks the build never becomes a pull request.
name: Update flake inputs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2>&1 | tee update.log
          {
            echo 'summary<<EOF'
            grep -E "^(•|  )" update.log || echo "(no changes)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm update.log

      - name: Build every check with the updated inputs
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' \
            | xargs nix build -L --no-link

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flake-inputs
          delete-branch: true
          commit-message: "Update flake inputs"
          title: "Update flake inputs"
          labels: dependencies
          body: |
            Weekly update of nixpkgs and the other flake inputs.

            **All flake checks were built successfully with these inputs** in
            [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            (CI does not run automatically on pull requests opened by GitHub
            Actions).

            After merging: `just deploy`, then `just reboot` if it says a
            reboot is needed.

            ```
            ${{ steps.update.outputs.summary }}
            ```
