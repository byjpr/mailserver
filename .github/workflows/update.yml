# Opens a pull request every week that bumps nixpkgs and the other flake
# inputs. Merging it (after CI passes) and running `just deploy` - or letting
# settings.autoUpgrade pick it up - keeps the server patched.
name: Update flake inputs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: DeterminateSystems/update-flake-lock@a2bbe0274e3a0c4194390a1e445f734c597ebc37 # v24
        with:
          pr-title: "Update flake inputs"
          pr-labels: dependencies
